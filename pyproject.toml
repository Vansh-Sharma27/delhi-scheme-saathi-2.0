[project]
name = "delhi-scheme-saathi-2-0"
version = "0.1.0"
description = "Voice-first Hindi chatbot helping Delhi residents discover and apply for government welfare schemes"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
authors = [
    {name = "AI for Bharat Team"}
]
keywords = ["chatbot", "telegram", "welfare-schemes", "delhi", "hindi", "voice-first"]

# Keep this list synchronized with requirements.lock. Runtime installs,
# Docker, and CI all consume the same exact direct dependency versions.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "asyncpg==0.31.0",
    "psycopg2-binary==2.9.12",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "openai==3.3.1",
    "python-telegram-bot==22.8",
    "boto3==1.43.77",
    "mangum==0.21.0",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.3",
    "mypy==2.3.1",
    "import-linter==2.13",
    "pip-audit==2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.importlinter]
root_package = "src"

[[tool.importlinter.contracts]]
name = "Conversation package one-way dependency order (ADR-0004)"
type = "layers"
layers = [
    "src.services.conversation.service",
    "src.services.conversation.views",
    "src.services.conversation.turn_policy",
    "src.services.conversation.intents",
    "src.services.conversation.scheme_reference",
    "src.services.conversation.language",
]
# This contract intentionally governs only the six named conversation modules.
# Imports to modules outside this package are not constrained by this layer rule.
ignore_unimported_packages = true
