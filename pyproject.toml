[project]
name = "delhi-scheme-saathi-2-0"
version = "0.1.0"
description = "Voice-first Hindi chatbot helping Delhi residents discover and apply for government welfare schemes"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
authors = [
    {name = "AI for Bharat Team"}
]
keywords = ["chatbot", "telegram", "welfare-schemes", "delhi", "hindi", "voice-first"]

# Keep this list synchronized with requirements.lock. Runtime installs,
# Docker, and CI all consume the same exact direct dependency versions.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "asyncpg==0.31.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "openai==3.3.1",
    "python-telegram-bot==22.8",
    "boto3==1.43.77",
    "mangum==0.21.0",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.3",
    "mypy==2.3.1",
    "import-linter==2.13",
    "pip-audit==2.7.0",
    "hypothesis==6.168.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.importlinter]
root_package = "src"
# Phase 4 ports import canonical domain types at runtime. TYPE_CHECKING
# imports remain visible to every contract.

[[tool.importlinter.contracts]]
name = "Conversation package one-way dependency order (ADR-0004)"
type = "layers"
layers = [
    "src.services.conversation.service",
    "src.services.conversation.views | src.dss.application.conversation.views",
    "src.dss.application.conversation.view_formatting",
    "src.dss.application.conversation.turn_policy",
    "src.dss.application.conversation.intents",
    "src.dss.application.conversation.scheme_reference",
    "src.dss.application.conversation.language",
]
# This contract intentionally governs only the six named conversation modules.
# Imports to modules outside this package are not constrained by this layer rule.
ignore_unimported_packages = true

[[tool.importlinter.contracts]]
name = "Modular monolith layer dependency direction (Phase 1 scaffolding)"
type = "layers"
containers = ["src.dss"]
# Target dependency direction from spec 1.1:
#   Interfaces -> Application -> Domain
#   Infrastructure -> Application ports
#   Domain -> nothing external
# Phase 1 creates the packages empty and moves nothing; this contract puts the
# boundary in place so violations are caught when code lands in later phases.
#
# Layer membership semantics (verified against import-linter 2.13):
#  - `domain`, `infrastructure`, and `interfaces` are listed as single layers,
#    so import-linter pulls ALL their descendants into that one layer. The four
#    `domain` subpackages are one undifferentiated layer, the six
#    `infrastructure` subpackages one layer, the two `interfaces` subpackages
#    one layer. Spec 1.1 constrains cross-layer direction only, so this is
#    acceptable; siblings within those layers may import each other.
#  - `application` is NOT listed as a layer. Its three use-case subpackages
#    (`application.conversation`, `application.matching`, `application.guidance`)
#    are listed as independent siblings (the `|` separator), so imports between
#    them are violations. `application.ports` is a separate, lower layer. This
#    split exists because `application.ports` is a descendant of `application`
#    and import-linter forbids a module appearing in two layers that share
#    descendants.
#  - `observability` and `settings` are independent siblings (`|`), NOT one
#    layer: `settings` importing `observability`, or the reverse, is a
#    violation. Phase 6 wiring must preserve the current shape (logging
#    configured from `settings.log_level` in the entrypoint, not by
#    `observability` importing `settings` or vice versa; spec 7.7/7.8).
#
# Transitive enforcement and the legacy-tree boundary:
#  - This contract walks downstream through non-layer modules. A `src.dss`
#    module importing a legacy `src.*` module whose dependency closure re-enters
#    `src.dss` at a layer STRICTLY ABOVE the importer fails the contract with
#    the full chain in the message. Today the facade at
#    `src.models.rejection_rule` -> `src.dss.domain.schemes.rejection_rule`
#    creates one such re-entry edge, so any importer below `domain` that
#    touches `src.main` (which imports `src.models.api` -> `src.models.rejection_rule`)
#    already fails. Each facade added in Phases 2-4 plants a new re-entry edge,
#    so the net widens each phase.
#  - The remaining blind spots are `bootstrap` (the top layer, nothing above
#    it) and the unlisted container root `src.dss.__init__`. Both are empty
#    until Phase 6. The `forbidden` contract below closes `bootstrap` and the
#    root against legacy `src.*` imports.
#  - Phase 6 landmine (spec 7.7): `CHAT_SESSION_PREFIX` moves into
#    `src/dss/settings.py`. A transient `from src.main import
#    CHAT_SESSION_PREFIX` inside `src.dss.settings` fails this gate today
#    (proven). The Phase 6 agent must copy the constant, never import it.
#
# Interfaces and application services still reach infrastructure during the
# transition. Infrastructure imports domain values; eligibility evaluation
# now belongs to domain and matching orchestrates it after raw retrieval.
layers = [
    "bootstrap",
    "interfaces",
    "application.conversation | application.matching | application.guidance",
    "infrastructure",
    "application.ports",
    "domain",
    "observability | settings",
]
ignore_unimported_packages = true

[[tool.importlinter.contracts]]
name = "No new src.dss code imports legacy src.* wiring (Phase 1 scaffolding)"
type = "forbidden"
source_modules = ["src.dss"]
# `src.**` matches every module under `src` including `src.dss.*`; the
# contract skips overlapping pairs (a source module is not forbidden from
# importing itself or its own descendants), so self-imports inside `src.dss`
# are unaffected. This closes the two blind spots the layers contract leaves:
# `bootstrap` (top layer, nothing above it to re-enter) and the unlisted
# container root `src.dss.__init__`. The ancestor includes bootstrap: listing
# bootstrap separately would also forbid its legitimate canonical siblings.
# Indirect imports are checked, so a `bootstrap` module that imports a legacy
# module which in turn imports `src.dss.*` also fails.
forbidden_modules = ["src.**"]
allow_indirect_imports = false
# Phase 6 settings migration: all adapters now read src.dss.settings directly.
# No legacy settings exception remains; all four contracts still apply.
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Phase 5 application and interfaces depend on ports, not infrastructure"
type = "forbidden"
source_modules = [
    "src.dss.application.conversation",
    "src.dss.application.matching",
    "src.dss.application.guidance",
    "src.dss.interfaces",
]
forbidden_modules = ["src.dss.infrastructure"]
allow_indirect_imports = false
