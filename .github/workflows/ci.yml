name: CI

on:
  push:
    branches: ["main", "arch/modular-monolith", "arch/phase-*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: pytest, ruff, mypy delta, import-linter, audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # The mypy delta gate checks the base revision in a temporary worktree.
          fetch-depth: 0

      - name: Set up Python 3.11.16
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install locked development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify dependency declarations
        run: python scripts/check_dependency_sync.py

      - name: Assert executable bits on scripts
        run: |
          set -euo pipefail
          for script in \
            scripts/rapid_redeploy.sh \
            scripts/seed_local_db.sh \
            scripts/set_telegram_webhook.py \
            scripts/test_conversation_flow.py \
            scripts/check_dependency_sync.py \
            scripts/check_mypy_delta.py; do
            mode=$(git ls-files -s "$script" | cut -d' ' -f1)
            if [ "$mode" != "100755" ]; then
              echo "ERROR: $script has mode $mode, expected 100755"
              exit 1
            fi
            echo "OK: $script is executable ($mode)"
          done

      - name: Run pytest
        env:
          CI: "true"
        run: python -m pytest -q

      - name: Run ruff
        run: python -m ruff check .

      - name: Reject new mypy diagnostics
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          BASELINE_REF="$EVENT_BASE_SHA"
          if [ -z "$BASELINE_REF" ] || [[ "$BASELINE_REF" =~ ^0+$ ]]; then
            BASELINE_REF="HEAD^"
          fi
          python scripts/check_mypy_delta.py --baseline-ref "$BASELINE_REF"

      - name: Run import-linter
        run: lint-imports

      - name: Audit locked production dependencies
        # Fail instead of occupying a runner indefinitely if the advisory
        # service is unreachable or throttled.
        timeout-minutes: 5
        run: python -m pip_audit --strict -r requirements.lock
